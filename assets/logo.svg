<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <rect x="0" y="0" width="800" height="320" rx="10" fill="#1e1e2e"/>
  <rect x="0" y="0" width="800" height="34" rx="10" fill="#181825"/>
  <rect x="0" y="22" width="800" height="12" fill="#181825"/>
  <rect x="10" y="7" width="150" height="26" rx="6" fill="#313244"/>
  <text x="85" y="25" text-anchor="middle" font-family="JetBrains Mono, Cascadia Mono, DejaVu Sans Mono, monospace" font-size="14" fill="#cdd6f4">safeusb - bash</text>
  <text x="170" y="25" font-family="JetBrains Mono, Cascadia Mono, DejaVu Sans Mono, monospace" font-size="14" fill="#6c7086">+</text>
  <g font-family="JetBrains Mono, Cascadia Mono, DejaVu Sans Mono, monospace" font-size="22">
    <text x="28" y="92" fill="#a6e3a1">user</text><text x="84" y="92" fill="#cdd6f4">@</text><text x="98" y="92" fill="#89b4fa">arch</text>
    <text x="158" y="92" fill="#cdd6f4"> ~/safeusb</text><text x="342" y="92" fill="#f5c2e7">$</text>
    <text x="368" y="92" fill="#cdd6f4">safeusb flash ubuntu.iso /dev/sdb</text>
    <text x="28" y="132" fill="#a6adc8">flash done: 512.0 MiB written | sha256 c457d02b...fbf7ee4b | verified yes</text>
    <text x="28" y="172" fill="#a6e3a1">user</text><text x="84" y="172" fill="#cdd6f4">@</text><text x="98" y="172" fill="#89b4fa">arch</text>
    <text x="158" y="172" fill="#cdd6f4"> ~/safeusb</text><text x="342" y="172" fill="#f5c2e7">$</text>
    <text x="368" y="172" fill="#cdd6f4">safeusb sum ubuntu.iso --check c457d02b</text>
    <text x="28" y="212" fill="#a6adc8">ok: ubuntu.iso</text>
    <text x="28" y="252" fill="#a6e3a1">user</text><text x="84" y="252" fill="#cdd6f4">@</text><text x="98" y="252" fill="#89b4fa">arch</text>
    <text x="158" y="252" fill="#cdd6f4"> ~/safeusb</text><text x="342" y="252" fill="#f5c2e7">$</text>
    <rect x="368" y="232" width="13" height="26" fill="#cdd6f4"/>
  </g>
</svg>
